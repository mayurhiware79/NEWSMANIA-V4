<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo_.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NewsMania - Explore Every Angle of Every News</title>

    <!-- Primary Meta Tags -->
    <meta
      name="title"
      content="NewsMania - Explore Every Angle of Every News"
    />
    <meta
      name="description"
      content="NewsMania is your ultimate news aggregator, bringing you diverse perspectives from top media sources. Stay informed, stay unbiased."
    />
    <meta
      name="keywords"
      content="News, News Aggregator, NewsMania, Multiple Sources News, Balanced News, Current Affairs, Politics, World News, Technology News, News App"
    />
    <meta name="author" content="NewsMania Team" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://newsmania.com/" />
    <meta
      property="og:title"
      content="NewsMania - Explore Every Angle of Every News"
    />
    <meta
      property="og:description"
      content="Get unbiased, multi-source news with NewsMania. A centralized hub that brings you all sides of the story."
    />
    <meta property="og:image" content="https://newsmania.com/preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://newsmania.com/" />
    <meta
      property="twitter:title"
      content="NewsMania - Explore Every Angle of Every News"
    />
    <meta
      property="twitter:description"
      content="Get unbiased, multi-source news with NewsMania. A centralized hub that brings you all sides of the story."
    />
    <meta
      property="twitter:image"
      content="https://newsmania.com/preview.png"
    />

    <!-- PWA/Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://newsmania.com/" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
